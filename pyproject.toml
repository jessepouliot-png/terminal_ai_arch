[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-ai-terminal"
version = "1.0.0"
description = "Production-grade AI Terminal for Arch Linux with Docker Sandbox, Steam & ProtonDB, and Gemini Tool Calling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "googlesearch-python>=1.2.0",
    "docker>=7.0.0",
    "tenacity>=8.0.0",
    "aiosqlite>=0.20.0"
]

[project.scripts]
arch-terminal = "arch_ai.agent_terminal:main"
agent-terminal = "arch_ai.agent_terminal:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["arch_ai"]

[tool.ruff]
# Target Python version matching CI environment
target-version = "py312"
line-length = 100

# Specify directories to include
src = ["src", "tests"]

# Exclude scratch files, caches, and build directories
extend-exclude = [
    "custom_mcp_server.py",
    "list_mcp_tools.py",
    "test_gemini_mcp.py",
    "test_mcp.py",
    ".venv",
    "build",
    "dist"
]

[tool.ruff.lint]
# Select core correctness rules:
# E: Pyflakes / SyntaxErrors
# F: Pyflakes Unused / Undefined
# W: Warnings
select = ["E", "F", "W"]

# Ignore line-length violations (handled by rich wrapping / terminal output formatting)
# Ignore whitespace / comment formatting that does not affect execution
ignore = [
    "E501",  # Line too long
    "E402",  # Module level import not at top of file
    "W291",  # Trailing whitespace
    "W293"   # Blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
# Allow tests to use asserts and mock imports freely
"tests/*" = [
    "S101",  # Use of assert
    "F401",  # Unused imports in mocks
    "F841"   # Local variable name assigned but never used in mocks
]
