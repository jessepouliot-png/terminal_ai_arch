[pytest]
testpaths = tests
norecursedirs = .venv venv build dist .git __pycache__ src/arch_ai_terminal.egg-info
pythonpath = src .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
addopts = 
    -v
    --ignore=tests/test_sentry.py
    --ignore=tests/test_steam_mcp.py
    -W ignore::DeprecationWarning
